allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// 1) Force every Flutter plugin (e.g. old fluttertoast, compiled against android-33)
//    to compile against a recent SDK.
// 2) Disable the release lint check: it crashes on CI (lintVitalAnalyzeRelease) and does
//    not affect the produced APK.
// Must stay BEFORE the evaluationDependsOn block.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                lint {
                    checkReleaseBuilds false
                    abortOnError false
                }
            }
            if (project.name != 'app') {
                project.android {
                    compileSdkVersion 36
                }
            }
        }
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete(rootProject.buildDir)
}
